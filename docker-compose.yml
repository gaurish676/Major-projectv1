version: '3.8'

services:
  tasknest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasknest-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - tasknest-data:/app/data
    restart: unless-stopped

volumes:
  tasknest-data:
    driver: local
